<!doctype html>
<html>
<head><meta charset="utf-8"><style>body { margin: 0; } iframe { border: 0; display: block; }</style></head>
<body>
<iframe id="board"></iframe>
<pre id="result"></pre>
<script>
// Loads the board at the size in the query string, stubs window.lavish,
// drives it by keyboard and writes what it saw into #result.
(async () => {
  const params = new URLSearchParams(location.search);
  const frame = document.getElementById("board");
  frame.style.width = params.get("w") + "px";
  frame.style.height = params.get("h") + "px";
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const loaded = new Promise((resolve) => { frame.onload = resolve; });
  frame.src = "index.html";
  await loaded;
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  const prompts = [];
  let sends = 0;
  win.lavish = { queuePrompt: (text, options) => prompts.push({ text, options }), sendQueuedPrompts: () => { sends++; } };
  for (let i = 0; i < 50 && !doc.querySelector(".card"); i++) await sleep(100);

  const key = (name, target) => (target || doc).dispatchEvent(new win.KeyboardEvent("keydown", { key: name, bubbles: true }));
  const root = doc.scrollingElement;
  const cards = [...doc.querySelectorAll(".card")];

  if (params.has("layout")) {
    // A card is covered when a sample point inside the viewport shows
    // something else, and in full view when every sample point shows it.
    const samples = (rect) => [0.2, 0.5, 0.8].flatMap((x) => [0.2, 0.5, 0.8].map((y) => [rect.left + rect.width * x, rect.top + rect.height * y]));
    const inside = ([x, y]) => x >= 0 && y >= 0 && x < win.innerWidth && y < win.innerHeight;
    const shows = (card, point) => card.contains(doc.elementFromPoint(...point));
    const unreachable = cards.filter((card) => card.getBoundingClientRect().bottom + win.scrollY > root.scrollHeight).map((card) => card.dataset.key);
    const covered = cards.filter((card) => samples(card.getBoundingClientRect()).filter(inside).some((point) => !shows(card, point))).map((card) => card.dataset.key);
    const body = doc.querySelector(".peek .body");
    const peekClipped = !body || body.scrollHeight > body.clientHeight + 1;
    const peekFull = !!body && body.textContent.endsWith("END-OF-BODY");
    const hidden = [];
    for (let i = 0; i < cards.length; i++) {
      const card = doc.querySelector(".card.selected");
      if (!samples(card.getBoundingClientRect()).every((point) => inside(point) && shows(card, point))) hidden.push(card.dataset.key);
      key("j");
      if (doc.querySelector(".card.selected") === card) break;
    }
    document.getElementById("result").textContent = JSON.stringify({ cards: cards.length, unreachable, covered, peekClipped, peekFull, hidden });
    return;
  }

  const columns = {};
  cards.forEach((card) => { columns[card.dataset.key] = card.dataset.column; });
  const lanes = [...doc.querySelectorAll(".lane")].map((lane) => lane.dataset.lane);
  const pageScrollsX = root.scrollWidth > root.clientWidth;
  const pageScrollsY = root.scrollHeight > root.clientHeight;

  const filter = doc.getElementById("filter");
  key("/");
  filter.value = params.get("issue");
  filter.dispatchEvent(new win.Event("input", { bubbles: true }));
  key("Enter", filter);
  key("j");
  const selected = doc.querySelector(".card.selected")?.dataset.key;
  key("s");
  const dialog = !doc.getElementById("confirm").hidden;
  key("Enter");
  key("s");
  key("Enter");
  const activity = doc.getElementById("activity").textContent;

  document.getElementById("result").textContent = JSON.stringify({ columns, lanes, pageScrollsX, pageScrollsY, selected, dialog, prompts, sends, activity });
})();
</script>
</body>
</html>
