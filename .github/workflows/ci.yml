# Pull requests, including forks, run only on GitHub-hosted runners.
# No job receives repository secrets or write permissions.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct

# One group per workflow and ref: a new push to the same PR cancels its superseded run,
# while runs for different PRs do not cancel each other. A push to main is keyed on its
# commit SHA, so a later push never replaces the run of an earlier commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Clean stale job-local Go caches
        run: |
          cache_prefix="$RUNNER_TEMP/posse-${{ github.repository_id }}"
          for cache in "$RUNNER_TEMP"/posse-go-cache-* "$RUNNER_TEMP"/posse-go-mod-* "$cache_prefix"-go-cache-* "$cache_prefix"-go-mod-*; do
            [ -d "$cache" ] || continue
            case "$cache" in
              *-"$GITHUB_RUN_ID"-"$GITHUB_RUN_ATTEMPT"-*) continue ;;
            esac
            find "$cache" -type d -exec chmod u+w {} +
            rm -rf -- "$cache"
          done
      - name: Use job-local Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/posse-${{ github.repository_id }}-go-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-lint" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/posse-go-mod" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/posse-go-mod
          key: go-mod-${{ runner.os }}-lint-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-lint-
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            go mod download &&
            scripts/staticcheck.sh --version >/dev/null && exit 0
            echo "go mod download failed (attempt $attempt)" >&2
            sleep $((attempt * 5))
          done
          exit 1
      - name: Check formatting
        run: |
          files=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet -tags=e2e,perf ./...
      - name: Staticcheck
        run: scripts/staticcheck.sh
      - name: Check generated code
        run: |
          go generate ./...
          git diff --exit-code
      - name: Clean job-local Go caches
        if: ${{ always() }}
        run: |
          if [ -d "$GOCACHE" ]; then
            find "$GOCACHE" -type d -exec chmod u+w {} +
          fi
          rm -rf -- "$GOCACHE"

  test-plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use job-local Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/posse-${{ github.repository_id }}-go-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-test-plan" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/posse-go-mod" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/posse-go-mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt)" >&2
            sleep $((attempt * 5))
          done
          exit 1
      - name: Check race shard assignments
        run: scripts/run-race-shard.sh --self-test
      - name: Check changed-test stress script
        run: scripts/stress-changed-tests.sh --self-test
      - name: Plan race shards
        id: plan
        run: echo "shards=$(scripts/run-race-shard.sh --matrix)" >> "$GITHUB_OUTPUT"
      - name: Clean job-local Go caches
        if: ${{ always() }}
        run: |
          if [ -d "$GOCACHE" ]; then
            find "$GOCACHE" -type d -exec chmod u+w {} +
          fi
          rm -rf -- "$GOCACHE"

  test-shard:
    name: test shard ${{ matrix.shard }}
    needs: [test-plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.test-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use job-local Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/posse-${{ github.repository_id }}-go-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-test-${{ matrix.shard }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/posse-go-mod" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/posse-go-mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt)" >&2
            sleep $((attempt * 5))
          done
          exit 1
      - name: Run race-enabled test shard
        env:
          POSSE_E2E_TMP_PREFIX: posse-e2e-${{ github.run_id }}-${{ github.run_attempt }}-test-${{ matrix.shard }}-
        run: scripts/run-race-shard.sh "${{ matrix.shard }}" "${{ strategy.job-total }}"
      - name: Clean test temporary roots and caches
        if: ${{ always() }}
        run: |
          prefix="posse-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-test-${{ matrix.shard }}-"
          for root in /tmp/"$prefix"*; do
            [ -d "$root" ] || continue
            find "$root" -type d -exec chmod u+rwx {} +
            rm -rf -- "$root"
          done
          if [ -d "$GOCACHE" ]; then
            find "$GOCACHE" -type d -exec chmod u+w {} +
          fi
          rm -rf -- "$GOCACHE"

  test:
    if: ${{ always() }}
    needs: [test-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the required test check
        env:
          SHARDS_RESULT: ${{ needs.test-shard.result }}
        run: |
          if [ "$SHARDS_RESULT" != success ]; then
            echo "Race test shard matrix result: $SHARDS_RESULT"
            exit 1
          fi
          echo "All race-enabled test shards passed."

  e2e-plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      selected: ${{ steps.plan.outputs.selected }}
      total: ${{ steps.plan.outputs.total }}
      coverage_required: ${{ steps.plan.outputs.coverage_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use job-local Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/posse-${{ github.repository_id }}-go-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-e2e-plan" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/posse-go-mod" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/posse-go-mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt)" >&2
            sleep $((attempt * 5))
          done
          exit 1
      - name: Check E2E coverage map tools
        run: |
          scripts/run-e2e-shard.sh --self-test
          scripts/test-e2e-selector.sh
          scripts/test-e2e-coverage-map.sh
      - name: Download latest main E2E coverage map
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! run_ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&status=completed&per_page=100" | jq -r --arg sha "$BASE_SHA" '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and ((.name == "CI" and .event == "push") or (.name == "E2E main flake detection" and .event == "schedule"))) | .id'); then
            echo "Could not find a main coverage map; running the full suite."
            exit 0
          fi
          for run_id in $run_ids; do
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name e2e-test-coverage-map --dir "$RUNNER_TEMP/e2e-coverage-map"; then
              break
            fi
          done
      - name: Plan E2E shards
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          matrix=$(scripts/run-e2e-shard.sh --matrix)
          total=$(printf '%s' "$matrix" | tr -d '[]' | awk -F, '{ print NF }')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = pull_request ] && git diff --name-only "$BASE_SHA...HEAD" | sh scripts/e2e-coverage-map-required.sh | grep -q '^true$'; then
            echo "coverage_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "coverage_required=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT_NAME" = pull_request ]; then
            map_file="$RUNNER_TEMP/e2e-coverage-map/e2e-test-coverage.tsv"
            if [ -r "$map_file" ] && ! scripts/select-e2e-tests.sh --self-test "$map_file"; then
              echo "E2E coverage map is invalid; running the full suite."
              echo "shards=$matrix" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ ! -r "$map_file" ]; then
              echo "shards=$matrix" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            selected=$(scripts/select-e2e-tests.sh --list "$BASE_SHA" "$map_file")
            if [ -z "$selected" ]; then
              echo 'shards=[1]' >> "$GITHUB_OUTPUT"
              echo 'selected=PosseNoSelectedE2ETests' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            selected_pattern=$(printf '%s\n' "$selected" | paste -sd'|' -)
            plan=$(scripts/run-e2e-shard.sh --plan)
            shards=$(printf '%s\n' "$plan" | awk -v selected="$selected_pattern" '$3 ~ "^(" selected ")$" { seen[$1]=1 } END { for (s in seen) print s }' | sort -n | paste -sd, - | sed 's/.*/[&]/')
            echo "shards=$shards" >> "$GITHUB_OUTPUT"
            echo "selected=$selected_pattern" >> "$GITHUB_OUTPUT"
          else
            echo "shards=$matrix" >> "$GITHUB_OUTPUT"
          fi
      - name: Clean job-local Go caches
        if: ${{ always() }}
        run: |
          if [ -d "$GOCACHE" ]; then
            find "$GOCACHE" -type d -exec chmod u+w {} +
          fi
          rm -rf -- "$GOCACHE"

  e2e-shard:
    name: e2e shard ${{ matrix.shard }}
    if: ${{ needs.e2e-plan.outputs.selected != 'PosseNoSelectedE2ETests' }}
    needs: [e2e-plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use job-local Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/posse-${{ github.repository_id }}-go-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-e2e-${{ matrix.shard }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/posse-go-mod" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/posse-go-mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt)" >&2
            sleep $((attempt * 5))
          done
          exit 1
      - name: Install pinned Herdr release
        run: |
          tool_dir="$RUNNER_TEMP/posse-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/herdr"
          mkdir -p "$tool_dir"
          herdr="$tool_dir/herdr"
          curl -fsSL \
            https://github.com/herdrdev/herdr/releases/download/v0.9.1/herdr-linux-x86_64 \
            -o "$herdr"
          printf '%s  %s\n' \
            2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7 \
            "$herdr" | sha256sum --check --status
          chmod 755 "$herdr"
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$herdr" --version
      - name: Run first isolated Herdr end-to-end shard
        env:
          POSSE_E2E_SELECTED: ${{ needs.e2e-plan.outputs.selected }}
          POSSE_E2E_COVERAGE_DIR: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || needs.e2e-plan.outputs.coverage_required == 'true') && format('{0}/e2e-coverage', runner.temp) || '' }}
          POSSE_E2E_TMP_PREFIX: posse-e2e-${{ github.run_id }}-${{ github.run_attempt }}-pass1-shard-${{ matrix.shard }}-
        run: |
          if [ -n "$POSSE_E2E_COVERAGE_DIR" ]; then
            scripts/run-e2e-coverage-shard.sh "${{ matrix.shard }}" "${{ needs.e2e-plan.outputs.total }}" "$POSSE_E2E_COVERAGE_DIR"
          else
            scripts/run-e2e-shard.sh "${{ matrix.shard }}" "${{ needs.e2e-plan.outputs.total }}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || needs.e2e-plan.outputs.coverage_required == 'true') && success() }}
        with:
          name: e2e-coverage-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-coverage
          if-no-files-found: error
          retention-days: 1
      - name: Check command CPU budgets without the race detector
        if: ${{ matrix.shard == 1 }}
        env:
          POSSE_E2E_TMP_PREFIX: posse-e2e-${{ github.run_id }}-${{ github.run_attempt }}-pass1-shard-${{ matrix.shard }}-perf-
        run: go test -tags='e2e perf' -count=1 ./internal/e2e -run '^TestCommandPerformanceBudgets$'
      - name: Clean first-pass Herdr processes, fixtures and caches
        if: ${{ always() }}
        run: |
          prefix="posse-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pass1-shard-${{ matrix.shard }}-"
          for process in /proc/[0-9]*; do
            [ -r "$process/environ" ] || continue
            if ! tr '\0' '\n' < "$process/environ" 2>/dev/null | grep -Fxq 'POSSE_TEST_HERDR=1'; then
              continue
            fi
            if ! tr '\0' '\n' < "$process/environ" 2>/dev/null | grep -Eq "^XDG_CONFIG_HOME=/tmp/${prefix}[^/]*/xdg$"; then
              continue
            fi
            command_line=$(tr '\0' ' ' < "$process/cmdline" 2>/dev/null || true)
            case "$command_line" in
              *herdr*server*) kill "${process##*/}" 2>/dev/null || true ;;
            esac
          done
          for root in /tmp/"$prefix"* /var/tmp/"$prefix"installed-*; do
            [ -d "$root" ] || continue
            find "$root" -type d -exec chmod u+rwx {} +
            rm -rf -- "$root"
          done
          rm -rf -- "$RUNNER_TEMP/posse-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ -d "$GOCACHE" ]; then
            find "$GOCACHE" -type d -exec chmod u+w {} +
          fi
          rm -rf -- "$GOCACHE"

  e2e-coverage-map:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || needs.e2e-plan.outputs.coverage_required == 'true') && needs.e2e-shard.result == 'success' }}
    needs: [e2e-plan, e2e-shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: e2e-coverage-*
          path: ${{ runner.temp }}/e2e-coverage
          merge-multiple: true
      - name: Build E2E test coverage map
        env:
          TOTAL: ${{ needs.e2e-plan.outputs.total }}
          MAP_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: scripts/build-e2e-coverage-map.sh "$RUNNER_TEMP/e2e-coverage" "$MAP_COMMIT" "$TOTAL" "$RUNNER_TEMP/e2e-test-coverage.tsv"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-coverage-map
          path: ${{ runner.temp }}/e2e-test-coverage.tsv
          retention-days: 30

  e2e:
    if: ${{ always() }}
    needs: [e2e-plan, e2e-shard, e2e-coverage-map]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the required e2e check
        env:
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
          COVERAGE_RESULT: ${{ needs.e2e-coverage-map.result }}
          COVERAGE_REQUIRED: ${{ needs.e2e-plan.outputs.coverage_required }}
          EVENT_NAME: ${{ github.event_name }}
          SELECTED: ${{ needs.e2e-plan.outputs.selected }}
        run: |
          if [ "$SHARDS_RESULT" = skipped ] && [ "$EVENT_NAME" = pull_request ] && [ "$SELECTED" = PosseNoSelectedE2ETests ]; then
            echo "No E2E tests selected for this change."
            exit 0
          fi
          if [ "$SHARDS_RESULT" != success ]; then
            echo "E2E shard matrix result: $SHARDS_RESULT"
            exit 1
          fi
          if { [ "$EVENT_NAME" = push ] || [ "$COVERAGE_REQUIRED" = true ]; } && [ "$COVERAGE_RESULT" != success ]; then
            echo "E2E coverage map result: $COVERAGE_RESULT"
            exit 1
          fi
          echo "All required E2E checks passed."

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned ShellCheck
        run: |
          tool_dir="$RUNNER_TEMP/posse-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/shellcheck"
          mkdir -p "$tool_dir"
          archive="$tool_dir/shellcheck-v0.11.0.linux.x86_64.tar.gz"
          curl -fsSL \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz \
            -o "$archive"
          printf '%s  %s\n' \
            b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$tool_dir" shellcheck-v0.11.0/shellcheck
          chmod 755 "$tool_dir/shellcheck-v0.11.0/shellcheck"
          echo "$tool_dir/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          "$tool_dir/shellcheck-v0.11.0/shellcheck" --version
      - name: Install dash if needed
        run: |
          if command -v dash >/dev/null 2>&1; then
            echo "dash is already available at $(command -v dash)"
            exit 0
          fi
          command -v apt-get >/dev/null 2>&1 || { echo 'apt-get is required to download dash without root.' >&2; exit 1; }
          command -v dpkg >/dev/null 2>&1 || { echo 'dpkg is required to unpack dash without root.' >&2; exit 1; }
          tool_dir="$RUNNER_TEMP/posse-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/dash"
          unpack_dir="$tool_dir/root"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          apt-get download dash
          mkdir -p "$unpack_dir"
          dpkg -x ./dash_*.deb "$unpack_dir"
          dash_bin=
          for candidate in "$unpack_dir/bin/dash" "$unpack_dir/usr/bin/dash"; do
            if [ -x "$candidate" ]; then
              dash_bin=$candidate
              break
            fi
          done
          [ -n "$dash_bin" ] || { echo 'The downloaded dash package did not contain a dash executable.' >&2; exit 1; }
          echo "${dash_bin%/*}" >> "$GITHUB_PATH"
      - name: Check POSIX shell
        run: |
          shellcheck install.sh scripts/*.sh
      - name: Exercise installer under both shells
        run: |
          dash scripts/test-install.sh
          bash scripts/test-install.sh
      - name: Clean installer tool downloads
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/posse-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-installer"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use job-local Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/posse-${{ github.repository_id }}-go-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/posse-go-mod" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/posse-go-mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt)" >&2
            sleep $((attempt * 5))
          done
          exit 1
      - name: Cross-compile release targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-X main.version=ci" \
              -o "$RUNNER_TEMP/posse-$os-$arch" ./cmd/posse
          done
      - name: Clean cross-compile output
        if: ${{ always() }}
        run: |
          rm -f -- "$RUNNER_TEMP/posse-linux-amd64" "$RUNNER_TEMP/posse-linux-arm64" "$RUNNER_TEMP/posse-darwin-amd64" "$RUNNER_TEMP/posse-darwin-arm64"
          if [ -d "$GOCACHE" ]; then
            find "$GOCACHE" -type d -exec chmod u+w {} +
          fi
          rm -rf -- "$GOCACHE"

  stress-unit:
    name: stress changed unit tests
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use job-local Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/posse-${{ github.repository_id }}-go-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-stress-unit" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/posse-go-mod" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/posse-go-mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt)" >&2
            sleep $((attempt * 5))
          done
          exit 1
      - name: List changed unit tests
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          listing=$(scripts/stress-changed-tests.sh --list "$BASE_SHA")
          tests=$(printf '%s\n' "$listing" | awk '$1 == "unit"')
          printf '%s\n' "$tests"
          if [ -n "$tests" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - name: Stress changed unit tests with the race detector
        if: ${{ steps.changed.outputs.any == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          POSSE_E2E_TMP_PREFIX: posse-e2e-${{ github.run_id }}-${{ github.run_attempt }}-stress-unit-
          POSSE_STRESS_UNIT_BUDGET: 600
        run: scripts/stress-changed-tests.sh --run unit "$BASE_SHA"
      - name: Clean test temporary roots and caches
        if: ${{ always() }}
        run: |
          prefix="posse-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-stress-unit-"
          for root in /tmp/"$prefix"*; do
            [ -d "$root" ] || continue
            find "$root" -type d -exec chmod u+rwx {} +
            rm -rf -- "$root"
          done
          if [ -d "$GOCACHE" ]; then
            find "$GOCACHE" -type d -exec chmod u+w {} +
          fi
          rm -rf -- "$GOCACHE"

  stress-e2e:
    name: stress changed e2e tests
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use job-local Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/posse-${{ github.repository_id }}-go-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-stress-e2e" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/posse-go-mod" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/posse-go-mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt)" >&2
            sleep $((attempt * 5))
          done
          exit 1
      - name: List changed e2e tests
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          listing=$(scripts/stress-changed-tests.sh --list "$BASE_SHA")
          tests=$(printf '%s\n' "$listing" | awk '$1 == "e2e"')
          printf '%s\n' "$tests"
          if [ -n "$tests" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install pinned Herdr release
        if: ${{ steps.changed.outputs.any == 'true' }}
        run: |
          tool_dir="$RUNNER_TEMP/posse-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/herdr"
          mkdir -p "$tool_dir"
          herdr="$tool_dir/herdr"
          curl -fsSL \
            https://github.com/herdrdev/herdr/releases/download/v0.9.1/herdr-linux-x86_64 \
            -o "$herdr"
          printf '%s  %s\n' \
            2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7 \
            "$herdr" | sha256sum --check --status
          chmod 755 "$herdr"
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$herdr" --version
      - name: Stress changed E2E tests
        if: ${{ steps.changed.outputs.any == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          POSSE_E2E_TMP_PREFIX: posse-e2e-${{ github.run_id }}-${{ github.run_attempt }}-stress-e2e-
        run: scripts/stress-changed-tests.sh --run e2e "$BASE_SHA"
      - name: Clean stress Herdr processes, fixtures and tools
        if: ${{ always() }}
        run: |
          prefix="posse-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-stress-e2e-"
          for process in /proc/[0-9]*; do
            [ -r "$process/environ" ] || continue
            if ! tr '\0' '\n' < "$process/environ" 2>/dev/null | grep -Fxq 'POSSE_TEST_HERDR=1'; then
              continue
            fi
            if ! tr '\0' '\n' < "$process/environ" 2>/dev/null | grep -Eq "^XDG_CONFIG_HOME=/tmp/${prefix}[^/]*/xdg$"; then
              continue
            fi
            command_line=$(tr '\0' ' ' < "$process/cmdline" 2>/dev/null || true)
            case "$command_line" in
              *herdr*server*) kill "${process##*/}" 2>/dev/null || true ;;
            esac
          done
          for root in /tmp/"$prefix"* /var/tmp/"$prefix"installed-*; do
            [ -d "$root" ] || continue
            find "$root" -type d -exec chmod u+rwx {} +
            rm -rf -- "$root"
          done
          rm -rf -- "$RUNNER_TEMP/posse-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
      - name: Clean job-local Go caches
        if: ${{ always() }}
        run: |
          if [ -d "$GOCACHE" ]; then
            find "$GOCACHE" -type d -exec chmod u+w {} +
          fi
          rm -rf -- "$GOCACHE"
