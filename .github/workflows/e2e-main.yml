# Flake detection for main: a second pass of every E2E shard and the stopped
# Worker relaunch stress test. They run on a schedule instead of every push to
# main so merges do not compete with open PR runs for GitHub-hosted runners.
name: E2E main flake detection

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use job-local Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/posse-${{ github.repository_id }}-go-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-e2e-plan" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/posse-go-mod" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/posse-go-mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt)" >&2
            sleep $((attempt * 5))
          done
          exit 1
      - name: Check E2E shard assignments
        run: scripts/run-e2e-shard.sh --self-test
      - name: Plan E2E shards
        id: plan
        run: echo "shards=$(scripts/run-e2e-shard.sh --matrix)" >> "$GITHUB_OUTPUT"
      - name: Clean job-local Go caches
        if: ${{ always() }}
        run: |
          if [ -d "$GOCACHE" ]; then
            find "$GOCACHE" -type d -exec chmod u+w {} +
          fi
          rm -rf -- "$GOCACHE"

  e2e-main-duplicate:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: e2e main duplicate shard ${{ matrix.shard }}
    needs: [e2e-plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.e2e-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use job-local Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/posse-${{ github.repository_id }}-go-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-e2e-duplicate-${{ matrix.shard }}" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/posse-go-mod" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/posse-go-mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt)" >&2
            sleep $((attempt * 5))
          done
          exit 1
      - name: Install pinned Herdr release
        run: |
          tool_dir="$RUNNER_TEMP/posse-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/herdr"
          mkdir -p "$tool_dir"
          herdr="$tool_dir/herdr"
          curl -fsSL \
            https://github.com/herdrdev/herdr/releases/download/v0.9.1/herdr-linux-x86_64 \
            -o "$herdr"
          printf '%s  %s\n' \
            2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7 \
            "$herdr" | sha256sum --check --status
          chmod 755 "$herdr"
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$herdr" --version
      - name: Run duplicate isolated Herdr E2E shard
        env:
          POSSE_E2E_TMP_PREFIX: posse-e2e-${{ github.run_id }}-${{ github.run_attempt }}-pass2-shard-${{ matrix.shard }}-
        run: scripts/run-e2e-shard.sh "${{ matrix.shard }}" "${{ strategy.job-total }}"
      - name: Clean duplicate-pass Herdr processes, fixtures and caches
        if: ${{ always() }}
        run: |
          prefix="posse-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pass2-shard-${{ matrix.shard }}-"
          for process in /proc/[0-9]*; do
            [ -r "$process/environ" ] || continue
            if ! tr '\0' '\n' < "$process/environ" 2>/dev/null | grep -Fxq 'POSSE_TEST_HERDR=1'; then
              continue
            fi
            if ! tr '\0' '\n' < "$process/environ" 2>/dev/null | grep -Eq "^XDG_CONFIG_HOME=/tmp/${prefix}[^/]*/xdg$"; then
              continue
            fi
            command_line=$(tr '\0' ' ' < "$process/cmdline" 2>/dev/null || true)
            case "$command_line" in
              *herdr*server*) kill "${process##*/}" 2>/dev/null || true ;;
            esac
          done
          for root in /tmp/"$prefix"* /var/tmp/"$prefix"installed-*; do
            [ -d "$root" ] || continue
            find "$root" -type d -exec chmod u+rwx {} +
            rm -rf -- "$root"
          done
          rm -rf -- "$RUNNER_TEMP/posse-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ -d "$GOCACHE" ]; then
            find "$GOCACHE" -type d -exec chmod u+w {} +
          fi
          rm -rf -- "$GOCACHE"

  e2e-main-stress:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use job-local Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/posse-${{ github.repository_id }}-go-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-e2e-stress" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/posse-go-mod" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/posse-go-mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt)" >&2
            sleep $((attempt * 5))
          done
          exit 1
      - name: Install pinned Herdr release
        run: |
          tool_dir="$RUNNER_TEMP/posse-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/herdr"
          mkdir -p "$tool_dir"
          herdr="$tool_dir/herdr"
          curl -fsSL \
            https://github.com/herdrdev/herdr/releases/download/v0.9.1/herdr-linux-x86_64 \
            -o "$herdr"
          printf '%s  %s\n' \
            2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7 \
            "$herdr" | sha256sum --check --status
          chmod 755 "$herdr"
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$herdr" --version
      - name: Run stopped Worker relaunch stress regression
        env:
          POSSE_E2E_RELAUNCH_STRESS: "1"
          POSSE_E2E_TMP_PREFIX: posse-e2e-${{ github.run_id }}-${{ github.run_attempt }}-relaunch-stress-
        run: go test -tags=e2e -count=1 -timeout=9m ./internal/e2e -run '^TestStoppedWorkerPaneCanBeRelaunched$'
      - name: Clean stopped Worker stress fixtures and caches
        if: ${{ always() }}
        run: |
          prefix="posse-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-relaunch-stress-"
          for process in /proc/[0-9]*; do
            [ -r "$process/environ" ] || continue
            if ! tr '\0' '\n' < "$process/environ" 2>/dev/null | grep -Fxq 'POSSE_TEST_HERDR=1'; then
              continue
            fi
            if ! tr '\0' '\n' < "$process/environ" 2>/dev/null | grep -Eq "^XDG_CONFIG_HOME=/tmp/${prefix}[^/]*/xdg$"; then
              continue
            fi
            command_line=$(tr '\0' ' ' < "$process/cmdline" 2>/dev/null || true)
            case "$command_line" in
              *herdr*server*) kill "${process##*/}" 2>/dev/null || true ;;
            esac
          done
          for root in /tmp/"$prefix"* /var/tmp/"$prefix"installed-*; do
            [ -d "$root" ] || continue
            find "$root" -type d -exec chmod u+rwx {} +
            rm -rf -- "$root"
          done
          rm -rf -- "$RUNNER_TEMP/posse-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ -d "$GOCACHE" ]; then
            find "$GOCACHE" -type d -exec chmod u+w {} +
          fi
          rm -rf -- "$GOCACHE"
