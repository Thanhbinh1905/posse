name: Merge Fix Releases

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-fixes:
    # Only same-repository release-please PRs qualify; fork PRs never reach the token.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Merge reviewed, green fix-only release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          [ -n "$GH_TOKEN" ] || exit 1
          pr=$(gh api "repos/$REPO/pulls?state=open" --jq ".[] | select(.head.repo.full_name == \"$REPO\" and (.head.ref | startswith(\"release-please--branches--main\"))) | .number" | head -n 1)
          [ -n "$pr" ] || exit 0
          head=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          [ "$head" = "$HEAD_SHA" ] || exit 0
          review=$(gh pr view "$pr" --repo "$REPO" --json reviewDecision --jq '.reviewDecision')
          [ "$review" = APPROVED ] || exit 0
          body=$(gh pr view "$pr" --repo "$REPO" --json body --jq '.body')
          headings=$(printf '%s\n' "$body" | grep -E '^### ' || true)
          [ "$headings" = '### Bug Fixes' ] || exit 0
          if printf '%s\n' "$body" | grep -Eiq 'BREAKING CHANGE'; then exit 0; fi
          gh pr merge "$pr" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
