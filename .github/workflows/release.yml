name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use job-local Go caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/posse-${{ github.repository_id }}-go-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-release" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/posse-${{ github.repository_id }}-go-mod-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-release" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Publish release
        run: go run github.com/goreleaser/goreleaser/v2@v2.18.2 release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Clean release output
        if: ${{ always() }}
        run: |
          rm -rf -- dist
          for cache in "$GOCACHE" "$GOMODCACHE"; do
            [ -d "$cache" ] || continue
            find "$cache" -type d -exec chmod u+w {} +
          done
          rm -rf -- "$GOCACHE" "$GOMODCACHE"
