version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/store/queries.sql
    gen:
      go:
        package: sqlc
        out: internal/store/sqlc
        emit_interface: true
        emit_empty_slices: true
        rename:
          mount: Sandbox
          completed_rider_busy: CompletedWorkerBusy
          landing_mode: MergeMode
          landed_ref: MergedRef
          autonomy_land: AutonomyMerge
          mount_id: SandboxID
          ship_task_id: ChangeTaskID
          lookout_pane_id: WatchPaneID
          lookout_retry_at: WatchRetryAt
          lookout_failed_starts: WatchFailedStarts
          lookout_notice_raised: WatchNoticeRaised
